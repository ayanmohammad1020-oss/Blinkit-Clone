<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Signup form</h1>
    <hr>
    <form action="">
        <label for="Fname">First Name</label>
        <input type="text" id="Fname" placeholder="enter first name" name="Fname" required>

        <br><br>

        <label for="Lname">Last Name</label>
        <input type="text" id="Lname" placeholder="enter last name" name="Lname" required>

        <br><br>

        <label for="email">Email</label>
        <input type="text" id="email" placeholder="enter the email" name="email" required>

        <br><br>

        <label for="number">Number</label>
        <input type="number" id="number" name="number" required>

        <br><br>

        <label for="date">D.O.B.</label>
        <input type="date" id="date" name="date" min="2000-01-01" max="2026-08-17">

        <br><br>

        <label for="password">Password</label>
        <input type="password" id="password" name="password" placeholder="enter the password" required>

        <br><br>
        <hr>
        <button type="submit">Submit</button>
        <button type="reset">Reset</button>
    </form>    
    <p>Have account? <a href="login.html">Login here</a></p>
</body>
</html>
